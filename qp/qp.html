<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Examination - Understanding Fashion Library (FDO-355)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            background: linear-gradient(-45deg, #c6e7ff, #d8b4fe, #fde68a, #bbf7d0, #fbcfe8);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 30px 20px 15px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; }
        .header h2 { font-size: 1.25rem; font-weight: 500; margin-top: 4px; color: #333; }

        .admin-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            background: rgba(255,255,255,.25);
            border: 2px solid rgba(255,255,255,.5);
            color: #111;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .doc-container {
            background: white;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 85vh;
            min-height: 600px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Understanding Fashion Library (FDO-355)</h1>
        <h2>Final Examination Sample Questionnaire</h2>
    </div>

    <div class="container">
        <div class="doc-container">
            <iframe 
                src="https://docs.google.com/document/d/1iMpWxi5QJzVfcjJ3CSP7-Jemqd9jFR4MuwSHWh5ePPA/preview"
                allow="autoplay">
            </iframe>
        </div>
    </div>

</body>
</html>
