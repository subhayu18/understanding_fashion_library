<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Examination - Understanding Fashion Library (FDO-355)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            background: linear-gradient(-45deg, #c6e7ff, #d8b4fe, #fde68a, #bbf7d0, #fbcfe8);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 30px 20px 15px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; }
        .header h2 { font-size: 1.25rem; font-weight: 500; margin-top: 4px; color: #333; }

        .admin-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            background: rgba(255,255,255,.25);
            border: 2px solid rgba(255,255,255,.5);
            color: #111;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .doc-container {
            background: white;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 85vh;
            min-height: 600px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Understanding Fashion Library (FDO-355)</h1>
        <h2>Final Examination Sample Questionnaire</h2>
    </div>

    <!-- Admin Button (still works) -->
    <button class="admin-btn" onclick="showAdminPanel()">Admin</button>

    <div class="container">
        <div class="doc-container">
            <iframe 
                src="https://docs.google.com/document/d/1iMpWxi5QJzVfcjJ3CSP7-Jemqd9jFR4MuwSHWh5ePPA/preview"
                allow="autoplay">
            </iframe>
        </div>
    </div>

    <!-- Admin Panel (kept for future use) -->
    <div class="admin-panel" id="adminPanel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); justify-content:center; align-items:center; z-index:2000;">
        <div style="background:white; padding:30px; border-radius:16px; max-width:400px; text-align:center;">
            <h3>Admin Panel</h3>
            <p style="margin:15px 0;">This section is currently disabled as we are using the Google Docs version.</p>
            <button onclick="closeAdminPanel()" style="padding:10px 25px; border-radius:10px; border:none; background:#7c3aed; color:white; cursor:pointer;">Close</button>
        </div>
    </div>

    <script>
        function showAdminPanel() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "18022005") {
                document.getElementById('adminPanel').style.display = "flex";
            } else {
                alert("Incorrect password!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').style.display = "none";
        }
    </script>
</body>
</html>
